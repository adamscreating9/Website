<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resonance — Adam Hebert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('gallery-bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: -1;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #f0f0f0;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0 56px;
    }

    .back-link {
      align-self: flex-start;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.55);
      text-decoration: none;
      margin-bottom: 20px;
      padding: 0 20px;
      transition: color 0.2s ease;
    }

    .back-link:hover { color: #fff; }

    .piece-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sold-badge {
      display: none;
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 7px 16px;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
      z-index: 1;
    }

    .is-sold .sold-badge { display: inline-block; }
    .is-sold .piece-img { filter: grayscale(65%) brightness(0.7); }

    .piece-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .details {
      text-align: center;
      margin-top: 24px;
      padding: 0 20px;
      width: 100%;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .meta {
      margin-top: 6px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .medium {
      margin-top: 2px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .price {
      margin-top: 10px;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }

    .buy-button {
      display: inline-block;
      margin-top: 22px;
      padding: 14px 34px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      color: #111;
      background: #f0f0f0;
      text-decoration: none;
      border: 1px solid #f0f0f0;
      border-radius: 999px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .buy-button:hover,
    .buy-button:active {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .buy-button.is-sold-button {
      pointer-events: none;
      background: transparent;
      color: #f0f0f0;
      border-color: rgba(255, 255, 255, 0.45);
    }

    @media (min-width: 600px) {
      .piece-frame { width: min(70vw, 800px); }
      .piece-img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        box-shadow:
          0 10px 50px rgba(0, 0, 0, 0.75),
          0 2px 10px rgba(0, 0, 0, 0.6);
      }
      .back-link { padding: 0; }
      .details { padding: 0; width: auto; }
      h1 { font-size: 1.3rem; }
      .meta, .medium { font-size: 0.9rem; }
      .price { font-size: 1.1rem; }
      .buy-button { padding: 15px 38px; }
    }
  </style>
</head>
<body>

  <a class="back-link" href="index.html">← Shop</a>

  <div class="piece-frame">
    <img class="piece-img" src="gallery-6.jpg" alt="Resonance, painting by Adam Hebert">
    <span class="sold-badge">Sold</span>
  </div>

  <div class="details">
    <h1>Resonance</h1>
    <p class="meta">30 x 40</p>
    <p class="medium">Acrylic on canvas</p>
    <p class="price">$500</p>
    <a class="buy-button" id="buy-button" href="https://buy.stripe.com/4gM14p8Ut6SH0WI2lYes000">Buy</a>
  </div>

  <script>
    (function () {
      fetch('/.netlify/functions/sold-status')
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (status) {
          if (!status || status.resonance !== false) return;
          document.body.classList.add('is-sold');
          var btn = document.getElementById('buy-button');
          btn.textContent = 'Sold';
          btn.removeAttribute('href');
          btn.classList.add('is-sold-button');
        })
        .catch(function () { /* fail open: leave Buy button as-is */ });
    })();
  </script>

</body>
</html>
