<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adam Hebert — Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('gallery-bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: -1;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #f0f0f0;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px 0 56px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
      padding: 0 20px;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .item {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .item-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      box-shadow:
        0 10px 50px rgba(0, 0, 0, 0.75),
        0 2px 10px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease;
    }

    .sold-badge {
      display: none;
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 14px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
    }

    .item.is-sold .sold-badge { display: inline-block; }
    .item.is-sold .item-img { filter: grayscale(65%) brightness(0.7); }
    .item.is-sold .price-tag { color: rgba(255, 255, 255, 0.85); }

    .item:hover .item-frame,
    .item:active .item-frame {
      transform: translateY(-2px);
    }

    .item-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .item-title {
      margin-top: 12px;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      padding: 0 20px;
    }

    .item-meta {
      margin-top: 2px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.55);
      padding: 0 20px;
    }

    @media (min-width: 600px) {
      body { padding: 40px 24px 64px; }
      h1 { font-size: 1.3rem; margin-bottom: 32px; padding: 0; }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        max-width: 900px;
        margin: 0 auto;
      }
      .item-title { font-size: 0.9rem; padding: 0; }
      .item-meta { font-size: 0.75rem; padding: 0; }
    }
  </style>
</head>
<body>

  <h1>Shop</h1>

  <div class="grid">
    <a class="item" href="resonance.html" data-painting="resonance">
      <div class="item-frame">
        <img class="item-img" src="gallery-6.jpg" alt="Resonance, painting by Adam Hebert">
        <span class="sold-badge">Sold</span>
      </div>
      <p class="item-title">Resonance</p>
      <p class="item-meta">30 x 40 · <span class="price-tag">$500</span></p>
    </a>

    <a class="item" href="release.html" data-painting="release">
      <div class="item-frame">
        <img class="item-img" src="gallery-1.jpg" alt="Release, painting by Adam Hebert">
        <span class="sold-badge">Sold</span>
      </div>
      <p class="item-title">Release</p>
      <p class="item-meta">30 x 40 · <span class="price-tag">$500</span></p>
    </a>
  </div>

  <script>
    (function () {
      fetch('/.netlify/functions/sold-status')
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (status) {
          if (!status) return;
          document.querySelectorAll('[data-painting]').forEach(function (el) {
            var key = el.getAttribute('data-painting');
            if (status[key] === false) {
              el.classList.add('is-sold');
              var tag = el.querySelector('.price-tag');
              if (tag) tag.textContent = 'Sold';
            }
          });
        })
        .catch(function () { /* fail open: leave Buy links as-is */ });
    })();
  </script>

</body>
</html>
