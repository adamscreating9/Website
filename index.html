<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adam Hebert — Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('gallery-bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: -1;
      animation: breathe 24s ease-in-out infinite;
      will-change: transform;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: -1;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #f0f0f0;
      -webkit-font-smoothing: antialiased;
    }

    .piece {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .piece-frame {
      width: min(90vw, 800px);
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .piece-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      box-shadow:
        0 10px 50px rgba(0, 0, 0, 0.75),
        0 2px 10px rgba(0, 0, 0, 0.6);
    }

    footer {
      text-align: center;
      padding: 16px 24px 56px;
    }

    .footer-text {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.1em;
    }

    @media (min-width: 600px) {
      .piece-frame { width: min(70vw, 800px); }
    }
  </style>
</head>
<body>

  <section class="piece">
    <div class="piece-frame">
      <img class="piece-img" src="gallery-1.jpg" alt="Painting by Adam Hebert, piece 1">
    </div>
  </section>

  <section class="piece">
    <div class="piece-frame">
      <img class="piece-img" src="gallery-2.jpg" alt="Painting by Adam Hebert, piece 2">
    </div>
  </section>

  <section class="piece">
    <div class="piece-frame">
      <img class="piece-img" src="gallery-3.jpg" alt="Painting by Adam Hebert, piece 3">
    </div>
  </section>

  <section class="piece">
    <div class="piece-frame">
      <img class="piece-img" src="gallery-4.jpg" alt="Painting by Adam Hebert, piece 4">
    </div>
  </section>

  <section class="piece">
    <div class="piece-frame">
      <img class="piece-img" src="gallery-5.jpg" alt="Painting by Adam Hebert, piece 5">
    </div>
  </section>

  <section class="piece">
    <div class="piece-frame">
      <img class="piece-img" src="gallery-6.jpg" alt="Painting by Adam Hebert, piece 6">
    </div>
  </section>

  <footer>
    <p class="footer-text">Adam Hebert · adamscreating</p>
  </footer>

</body>
</html>
